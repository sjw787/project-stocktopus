version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: stocktopus
      POSTGRES_USER: stocktopus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocktopus_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktopus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://stocktopus:${POSTGRES_PASSWORD:-stocktopus_dev}@db:5432/stocktopus
      REDIS_URL: redis://redis:6379/0
      ENV: development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: uvicorn stocktopus.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
